.snap-container {

<!-- 翻页滚动脚本（新版） -->
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const container = document.querySelector('.snap-container');
    if (!container) return;

    const pages = Array.from(container.querySelectorAll('.snap-page'));
    if (!pages.length) return;

    let isScrolling = false;

    // 计算“当前最靠近容器顶部的是第几页”
    function getCurrentIndex() {
      const containerRect = container.getBoundingClientRect();
      let idx = 0;
      let minDiff = Infinity;

      pages.forEach((page, i) => {
        const pageRect = page.getBoundingClientRect();
        const diff = Math.abs(pageRect.top - containerRect.top);
        if (diff < minDiff) {
          minDiff = diff;
          idx = i;
        }
      });

      return idx;
    }

    // 滚到指定页，让它顶到容器顶部
    function scrollToPage(index) {
      if (index < 0 || index >= pages.length) return;

      const containerRect = container.getBoundingClientRect();
      const pageRect = pages[index].getBoundingClientRect();
      const diff = pageRect.top - containerRect.top;
      const targetTop = container.scrollTop + diff;

      isScrolling = true;
      container.scrollTo({
        top: targetTop,
        behavior: 'smooth'
      });

      setTimeout(() => {
        isScrolling = false;
      }, 600); // 和滚动动画时间差不多
    }

    container.addEventListener('wheel', (e) => {
      if (isScrolling) {
        e.preventDefault();
        return;
      }

      const delta = e.deltaY;

      // ⭐ 每次滚之前，先根据实际位置算一遍当前页
      const currentIndex = getCurrentIndex();
      let targetIndex = currentIndex;

      if (delta > 0 && currentIndex < pages.length - 1) {
        targetIndex = currentIndex + 1;   // 向下：下一页
      } else if (delta < 0 && currentIndex > 0) {
        targetIndex = currentIndex - 1;   // 向上：上一页
      }

      if (targetIndex !== currentIndex) {
        e.preventDefault(); // 真要翻页才拦截默认滚动
        scrollToPage(targetIndex);
      }
      // 如果 targetIndex === currentIndex，就让浏览器自己处理滚动（几乎不会发生）
    }, { passive: false });
  });
</script>
